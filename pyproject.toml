[project]
name = "promptvault-demo"
version = "0.1.0"
description = "Streamlit demo and evaluation harness for PromptVault conversation compression"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
